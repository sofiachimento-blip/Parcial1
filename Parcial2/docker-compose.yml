services:
  db:
    build:
      context: .                      # raiz del proyecto (para copiar sql/tienda.sql)
      dockerfile: docker-pg/Dockerfile
    container_name: contenedor_tienda
    environment:
      POSTGRES_USER: ${BD_USER}
      POSTGRES_PASSWORD: ${BD_PASS}
      POSTGRES_DB: ${BD_BD}
    ports:
      - "5432:5432"                   # permite conectarse desde VS Code / pnpm dev
    volumes:
      - datos_pg:/var/lib/postgresql/data   # los datos persisten
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BD_USER} -d ${BD_BD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: app_tienda
    env_file: .env
    environment:
      BD_HOST: db                     # dentro de Docker la BD se llama por el nombre del servicio
      BD_PORT: 5432
    ports:
      - "${PUERTO:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy    # espera a que Postgres este listo

volumes:
  datos_pg:
